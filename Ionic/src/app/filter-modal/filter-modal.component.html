<!-- filter-modal.component.html -->
<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Filter Options</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Radius Slider -->
  <ion-item-divider>
    <ion-label>Radius</ion-label>
  </ion-item-divider>
  <ion-item>
    <ion-range min="0" max="500" step="1" [(ngModel)]="radius" pin="true">
      <ion-label slot="start">0</ion-label> 
      <ion-label slot="end">500</ion-label>
    </ion-range>
    <ion-text>{{ radius }} miles</ion-text>
  </ion-item>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-buttons slot="end">
      <ion-button color="primary" (click)="applyFilters()">Apply Filter</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
